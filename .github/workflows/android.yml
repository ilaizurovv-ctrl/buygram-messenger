name: Build Buygram APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Flet & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install flet buildozer

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Flet
        run: |
          flet build apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: buygram-release-apk
          path: build/apk/*.apk
