name: Build Buygram APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Flet & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install flet pyinstaller

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Flet
      env:
        FLET_SUPPRESS_ANALYTICS: "true"
      run: |
        python3 -c "import subprocess; subprocess.run(['flet', 'build', 'apk'], input=b'y\n')"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: buygram-release-apk
        path: build/sdist/*.apk
        if-no-files-found: ignore
